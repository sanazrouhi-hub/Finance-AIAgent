[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-risk-guard"
version = "0.1.0"
description = "Flower AgentApp privacy and financial risk checkpoint"
requires-python = ">=3.10"
dependencies = [
    "flwr>=1.22.0",
    "openai>=1.30.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]